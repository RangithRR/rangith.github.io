<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranjith Portfolio</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    background: #0f172a;
    overflow-x: hidden;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* HEADER */
header {
    padding: 20px;
    text-align: center;
    background: #020617;
    font-size: 24px;
}

/* SECTIONS */
section {
    padding: 60px 20px;
    text-align: center;
}

/* BOX */
.box {
    border: 1px solid #38bdf8;
    margin: 20px auto;
    padding: 20px;
    width: 60%;
    border-radius: 10px;
    opacity: 0;
    transform: translateY(50px);
    transition: 0.6s;
}

.box.show {
    opacity: 1;
    transform: translateY(0);
}

/* BUTTON */
.btn {
    display: inline-block;
    padding: 10px 20px;
    background: #38bdf8;
    color: white;
    border-radius: 5px;
    text-decoration: none;
    margin-top: 10px;
    transition: 0.3s;
}

.btn:hover {
    background: #0ea5e9;
    transform: scale(1.1);
}

/* MOBILE */
@media (max-width: 768px) {
    .box {
        width: 90%;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<header>
Ranjith | Cloud Portfolio 🚀
</header>

<section>
<h1>Hello, I'm Ranjith</h1>
<p>Cloud & DevOps Learner</p>
</section>

<section>
<div class="box">
<h2>About Me</h2>
<p>Learning AWS, Linux and building real projects.</p>
</div>

<div class="box">
<h2>Skills</h2>
<p>AWS EC2 | Linux | Networking | Apache</p>
</div>

<div class="box">
<h2>Projects</h2>
<p>✔ Hosted website using EC2</p>
<a href="#" class="btn">View Project</a>
</div>

<div class="box">
<h2>Contact</h2>
<p>Email: yourmail@example.com</p>
<a href="#" class="btn">GitHub</a>
</div>
</section>

<script>
// SCROLL ANIMATION
const boxes = document.querySelectorAll('.box');

window.addEventListener('scroll', () => {
    boxes.forEach(box => {
        const top = box.getBoundingClientRect().top;
        if (top < window.innerHeight - 100) {
            box.classList.add('show');
        }
    });
});

// PARTICLES BACKGROUND
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

for (let i = 0; i < 80; i++) {
    particlesArray.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3,
        speedX: Math.random() - 0.5,
        speedY: Math.random() - 0.5
    });
}

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particlesArray.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = "#38bdf8";
        ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
